<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
  <title id="title">Andrew Stephens drone video fallback poster</title>
  <desc id="desc">A bright abstract aerial landscape fallback for the hero drone video.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#d7ebe8"/>
      <stop offset="48%" stop-color="#fbfaf6"/>
      <stop offset="100%" stop-color="#d9c6a6"/>
    </linearGradient>
    <linearGradient id="land" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#8ca36c"/>
      <stop offset="40%" stop-color="#d7c3a0"/>
      <stop offset="100%" stop-color="#bfded5"/>
    </linearGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <rect width="1600" height="950" fill="url(#sky)"/>
  <circle cx="310" cy="160" r="210" fill="#fff" opacity=".58" filter="url(#soft)"/>
  <circle cx="1280" cy="140" r="260" fill="#b9ded4" opacity=".5" filter="url(#soft)"/>
  <path d="M0 550 C220 485 420 520 610 455 C830 378 1010 445 1210 380 C1390 322 1510 360 1600 338 L1600 950 L0 950 Z" fill="url(#land)" opacity=".9"/>
  <path d="M0 610 C250 535 405 580 640 510 C880 438 1040 520 1280 446 C1428 401 1534 414 1600 398" fill="none" stroke="#fff" stroke-opacity=".68" stroke-width="6"/>
  <path d="M0 680 C220 612 412 650 648 590 C900 526 1080 584 1320 514 C1450 476 1535 482 1600 462" fill="none" stroke="#171614" stroke-opacity=".1" stroke-width="3"/>
  <g opacity=".9">
    <text x="72" y="820" fill="#171614" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="900">ANDREW STEPHENS.</text>
    <text x="76" y="870" fill="#5f594f" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="4">CREATIVE DIGITAL STUDIO</text>
  </g>
</svg>
