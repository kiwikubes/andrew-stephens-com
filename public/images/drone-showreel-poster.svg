<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Andrew Stephens Studios placeholder media poster</title>
  <desc id="desc">A neon creative studio poster with a stylised drone silhouette over a cinematic horizon.</desc>
  <defs>
    <radialGradient id="cyan" cx="22%" cy="24%" r="55%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity=".82"/>
      <stop offset="58%" stop-color="#00e5ff" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="magenta" cx="76%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#ff2bd6" stop-opacity=".72"/>
      <stop offset="58%" stop-color="#ff2bd6" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#ff2bd6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lime" cx="62%" cy="82%" r="46%">
      <stop offset="0%" stop-color="#b8ff3c" stop-opacity=".42"/>
      <stop offset="66%" stop-color="#b8ff3c" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#b8ff3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="horizon" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity=".1"/>
      <stop offset="38%" stop-color="#fff" stop-opacity=".42"/>
      <stop offset="64%" stop-color="#ffd166" stop-opacity=".36"/>
      <stop offset="100%" stop-color="#ff2bd6" stop-opacity=".1"/>
    </linearGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M 72 0 L 0 0 0 72" fill="none" stroke="#fff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="#020204"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <rect width="1600" height="1000" fill="url(#cyan)"/>
  <rect width="1600" height="1000" fill="url(#magenta)"/>
  <rect width="1600" height="1000" fill="url(#lime)"/>
  <path d="M0 648 C206 588 356 612 526 552 C720 483 894 507 1096 455 C1294 404 1440 423 1600 376 L1600 1000 L0 1000 Z" fill="#060611"/>
  <path d="M0 686 C250 615 411 642 602 591 C780 543 927 571 1122 515 C1319 458 1460 485 1600 436" fill="none" stroke="url(#horizon)" stroke-width="5" opacity=".85" filter="url(#blur)"/>
  <path d="M0 686 C250 615 411 642 602 591 C780 543 927 571 1122 515 C1319 458 1460 485 1600 436" fill="none" stroke="url(#horizon)" stroke-width="2" opacity=".92"/>
  <g transform="translate(800 382)" filter="url(#softGlow)">
    <line x1="-236" y1="0" x2="236" y2="0" stroke="#fff" stroke-width="11" stroke-linecap="round" opacity=".9"/>
    <line x1="0" y1="-92" x2="0" y2="86" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".88"/>
    <rect x="-116" y="-38" width="232" height="76" rx="38" fill="#05050b" stroke="#fff" stroke-opacity=".72" stroke-width="4"/>
    <circle cx="-304" cy="0" r="56" fill="none" stroke="#00e5ff" stroke-width="10" opacity=".94"/>
    <circle cx="304" cy="0" r="56" fill="none" stroke="#ff2bd6" stroke-width="10" opacity=".94"/>
    <circle cx="0" cy="-154" r="48" fill="none" stroke="#b8ff3c" stroke-width="9" opacity=".9"/>
    <circle cx="0" cy="148" r="48" fill="none" stroke="#ffd166" stroke-width="9" opacity=".9"/>
    <circle cx="-304" cy="0" r="82" fill="#00e5ff" opacity=".13"/>
    <circle cx="304" cy="0" r="82" fill="#ff2bd6" opacity=".13"/>
    <path d="M-68 0 C-32 -26 34 -26 70 0 C36 24 -34 24 -68 0Z" fill="#fff" opacity=".86"/>
  </g>
  <g opacity=".6" fill="none" stroke-linecap="round">
    <path d="M80 830 H360" stroke="#00e5ff" stroke-opacity=".65" stroke-width="5"/>
    <path d="M80 866 H260" stroke="#ff2bd6" stroke-opacity=".55" stroke-width="5"/>
    <path d="M80 902 H430" stroke="#b8ff3c" stroke-opacity=".45" stroke-width="5"/>
  </g>
</svg>
